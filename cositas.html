<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Álex · rincón</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-deep:   #0d1410;
    --bg-mist:   #141d17;
    --line:      rgba(232,225,211,0.14);
    --line-soft: rgba(232,225,211,0.07);
    --text:      #ece7d8;
    --text-muted:#8b9a8d;
    --ember:     #c98a4b;
    --glow:      #cfe3c9;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:48px 20px;
    font-family:'Manrope', sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 70% 50% at 20% 0%, rgba(143,160,143,0.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201,138,75,0.06), transparent 60%),
      var(--bg-deep);
    position:relative;
    overflow-x:hidden;
  }

  /* grano sutil, generado sin imagen externa */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .card{
    width:100%;
    max-width:420px;
    position:relative;
  }

  /* luciérnaga: el único elemento con movimiento */
  .firefly{
    position:absolute;
    top:-14px;
    left:38%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--glow);
    box-shadow:0 0 8px 2px rgba(207,227,201,0.6);
    animation: drift 9s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translate(0,0); opacity:.35; }
    25%    { transform:translate(24px,10px); opacity:.9; }
    50%    { transform:translate(6px,26px); opacity:.4; }
    75%    { transform:translate(-20px,8px); opacity:.85; }
  }

  .eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:22px;
    font-weight:400;
  }

  .name{
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:44px;
    letter-spacing:0.5px;
    color:var(--text);
    margin-bottom:8px;
  }

  .sub{
    text-align:center;
    font-size:13px;
    color:var(--text-muted);
    font-weight:300;
    letter-spacing:0.5px;
    margin-bottom:34px;
  }

  .rule{
    width:56px;
    height:1px;
    background:var(--line);
    margin:0 auto 34px;
  }

  .links{
    display:flex;
    flex-direction:column;
  }

  .link-item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 6px;
    text-decoration:none;
    color:var(--text);
    border-bottom:1px solid var(--line-soft);
    transition:border-color .35s ease;
    position:relative;
  }
  .link-item:first-child{ border-top:1px solid var(--line-soft); }

  .link-item .icon{
    width:18px;
    height:18px;
    flex-shrink:0;
    color:var(--text-muted);
    transition:color .3s ease;
  }
  .link-item .icon svg{ width:100%; height:100%; display:block; }

  .link-item .label{
    flex:1;
    font-size:15px;
    font-weight:400;
    letter-spacing:0.3px;
    transition:color .3s ease, letter-spacing .3s ease;
  }

  .link-item .arrow{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:16px;
    color:var(--text-muted);
    opacity:0;
    transform:translateX(-4px);
    transition:opacity .3s ease, transform .3s ease;
  }

  .link-item:hover{
    border-color:rgba(201,138,75,0.35);
  }
  .link-item:hover .label{
    color:var(--ember);
    letter-spacing:0.6px;
  }
  .link-item:hover .icon{
    color:var(--ember);
  }
  .link-item:hover .arrow{
    opacity:1;
    transform:translateX(0);
    color:var(--ember);
  }

  .footer{
    text-align:center;
    font-size:10.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-top:36px;
    font-weight:300;
  }
  .footer span{ color:var(--ember); opacity:0.8; }

  @media (max-width:480px){
    .name{ font-size:36px; }
    .link-item{ padding:14px 4px; }
  }

  @media (prefers-reduced-motion: reduce){
    .firefly{ animation:none; opacity:.6; }
  }
</style>
</head>
